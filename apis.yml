description: OneASP (Application Security Protection) is the runtime application security
  product line of OneAPM (Beijing Blue Ocean Xuntong Technology / 蓝海讯通), a Qiming-backed
  Chinese IT operations management (ITOM) and application performance monitoring vendor
  founded in 2008. OneASP delivered runtime application self-protection (RASP) for
  web applications, and was also marketed internationally under the OneRASP brand.
  As of enrichment (2026-07), no standalone OneASP developer portal, public API, or
  SDK surface resolves - the oneasp.com brand domain no longer resolves and OneASP
  appears to be a legacy/absorbed product line of the parent OneAPM platform.
